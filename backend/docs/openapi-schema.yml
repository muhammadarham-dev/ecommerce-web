          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBannerManagementRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBannerManagementRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBannerManagementRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerManagement'
          description: ''
    delete:
      operationId: banners_management_banners_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this banner.
        required: true
      tags:
      - banners
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/cart/:
    get:
      operationId: cart_retrieve
      summary: Get shopping cart
      tags:
