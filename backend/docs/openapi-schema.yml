openapi: 3.0.3
info:
  title: Ecommerce Web API
  version: 1.0.0
  description: REST API documentation for the Ecommerce Web platform, including authentication,
    catalog, cart, checkout, orders, payments, returns, inventory and administration.
  contact:
    name: Ecommerce Web Support
    email: support@example.com
paths:
  /api/account-security/email/confirm/:
    post:
      operationId: account_security_email_confirm_create
      summary: Confirm email verification
      tags:
      - Account Security
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/account-security/email/send/:
    post:
      operationId: account_security_email_send_create
      summary: Send email verification link
      tags:
      - Account Security
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/account-security/login/:
    post:
      operationId: account_security_login_create
      description: Authenticate a user using a username or email address and return
        JWT tokens.
      summary: Secure user login
      tags:
      - Account Security
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecureLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SecureLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SecureLoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
          description: ''
  /api/account-security/login-attempts/:
    get:
      operationId: account_security_login_attempts_list
      parameters:
      - in: query
        name: created_from
        schema:
          type: string
          format: date-time
      - in: query
        name: created_to
        schema:
          type: string
          format: date-time
      - in: query
        name: email
        schema:
          type: string
      - in: query
        name: failure_reason
        schema:
          type: string
          enum:
          - IDENTIFIER_BLOCKED
          - INACTIVE_ACCOUNT
          - INVALID_CREDENTIALS
          - IP_BLOCKED
          - NONE
        description: |-
          * `INVALID_CREDENTIALS` - Invalid Credentials
          * `IDENTIFIER_BLOCKED` - Identifier Temporarily Blocked
          * `IP_BLOCKED` - IP Address Temporarily Blocked
          * `INACTIVE_ACCOUNT` - Inactive Account
          * `NONE` - None
      - in: query
        name: identifier_hint
        schema:
          type: string
      - in: query
        name: ip_address
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: successful
        schema:
          type: boolean
      - in: query
        name: user
        schema:
          type: integer
      - in: query
        name: username
        schema:
          type: string
      tags:
      - account-security
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoginAttempt'
          description: ''
  /api/account-security/login-summary/:
    get:
      operationId: account_security_login_summary_retrieve
      description: Return successful, failed and blocked login attempt statistics.
      summary: Get login security summary
      tags:
      - Account Security
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/account-security/logout/:
    post:
      operationId: account_security_logout_create
      description: Blacklist the supplied refresh token.
      summary: Sign out current session
      tags:
      - Account Security
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecureLogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SecureLogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SecureLogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/account-security/logout-all/:
    post:
      operationId: account_security_logout_all_create
      description: Revoke all active refresh tokens belonging to the authenticated
        user.
      summary: Sign out all devices
      tags:
      - Account Security
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutAllDevicesResponse'
          description: ''
  /api/account-security/password/change/:
    post:
      operationId: account_security_password_change_create
      description: Change the authenticated user's password and revoke active sessions.
      summary: Change account password
      tags:
      - Account Security
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/account-security/password/forgot/:
    post:
      operationId: account_security_password_forgot_create
      summary: Request password reset email
      tags:
      - Account Security
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/account-security/password/reset/:
    post:
      operationId: account_security_password_reset_create
      summary: Reset account password
      tags:
      - Account Security
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/account-security/status/:
    get:
      operationId: account_security_status_retrieve
      summary: Get account security status
      tags:
      - Account Security
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSecurityStatusResponse'
          description: ''
  /api/account-security/token/refresh/:
    post:
      operationId: account_security_token_refresh_create
      description: Rotate the refresh token and generate new access and refresh tokens.
      summary: Refresh authentication tokens
      tags:
      - Account Security
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecureTokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SecureTokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SecureTokenRefreshRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
          description: ''
  /api/audit-logs/business-events/:
    get:
      operationId: audit_logs_business_events_list
      parameters:
      - in: query
        name: actor_id
        schema:
          type: number
      - in: query
        name: app_label
        schema:
          type: string
      - in: query
        name: created_from
        schema:
          type: string
          format: date-time
      - in: query
        name: created_to
        schema:
          type: string
          format: date-time
      - in: query
        name: event_type
        schema:
          type: string
          enum:
          - COUPON_CREATED
          - COUPON_DELETED
          - COUPON_UPDATED
          - OTHER
          - PAYMENT_STATUS_CHANGED
          - PRODUCT_CREATED
          - PRODUCT_DELETED
          - PRODUCT_UPDATED
          - REFUND_PROCESSED
          - RETURN_CREATED
          - RETURN_STATUS_CHANGED
          - STOCK_MOVEMENT
        description: |-
          * `PRODUCT_CREATED` - Product Created
          * `PRODUCT_UPDATED` - Product Updated
          * `PRODUCT_DELETED` - Product Deleted
          * `COUPON_CREATED` - Coupon Created
          * `COUPON_UPDATED` - Coupon Updated
          * `COUPON_DELETED` - Coupon Deleted
          * `STOCK_MOVEMENT` - Stock Movement
          * `RETURN_CREATED` - Return Created
          * `RETURN_STATUS_CHANGED` - Return Status Changed
          * `PAYMENT_STATUS_CHANGED` - Payment Status Changed
          * `REFUND_PROCESSED` - Refund Processed
          * `OTHER` - Other
      - in: query
        name: ip_address
        schema:
          type: string
      - in: query
        name: method
        schema:
          type: string
      - in: query
        name: model_name
        schema:
          type: string
      - in: query
        name: object_id
        schema:
          type: string
      - in: query
        name: object_reference
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: path
        schema:
          type: string
      - in: query
        name: request_id
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: username
        schema:
          type: string
      tags:
      - audit-logs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusinessAuditEvent'
          description: ''
  /api/audit-logs/business-events/{id}/:
    get:
      operationId: audit_logs_business_events_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this business audit event.
        required: true
      tags:
      - audit-logs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAuditEvent'
          description: ''
  /api/audit-logs/business-summary/:
    get:
      operationId: audit_logs_business_summary_retrieve
      summary: Get business audit summary
      tags:
      - Audit Logs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/audit-logs/logs/:
    get:
      operationId: audit_logs_logs_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - CHECKOUT
          - CREATE
          - DELETE
          - EMAIL_VERIFICATION
          - LOGIN
          - LOGOUT
          - ORDER_CANCEL
          - OTHER
          - PASSWORD_CHANGE
          - PASSWORD_RESET
          - STATUS_CHANGE
          - UPDATE
        description: |-
          * `CREATE` - Create
          * `UPDATE` - Update
          * `DELETE` - Delete
          * `LOGIN` - Login
          * `LOGOUT` - Logout
          * `PASSWORD_CHANGE` - Password Change
          * `PASSWORD_RESET` - Password Reset
          * `EMAIL_VERIFICATION` - Email Verification
          * `CHECKOUT` - Checkout
          * `ORDER_CANCEL` - Order Cancellation
          * `STATUS_CHANGE` - Status Change
          * `OTHER` - Other
      - in: query
        name: created_from
        schema:
          type: string
          format: date-time
      - in: query
        name: created_to
        schema:
          type: string
          format: date-time
      - in: query
        name: email
        schema:
          type: string
      - in: query
        name: ip_address
        schema:
          type: string
      - in: query
        name: method
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: path
        schema:
          type: string
      - in: query
        name: route_name
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status_code
        schema:
          type: integer
      - in: query
        name: status_code_max
        schema:
          type: integer
      - in: query
        name: status_code_min
        schema:
          type: integer
      - in: query
        name: success
        schema:
          type: boolean
      - in: query
        name: user_id
        schema:
          type: number
      - in: query
        name: username
        schema:
          type: string
      tags:
      - audit-logs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/audit-logs/logs/{id}/:
    get:
      operationId: audit_logs_logs_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this audit log.
        required: true
      tags:
      - audit-logs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/audit-logs/summary/:
    get:
      operationId: audit_logs_summary_retrieve
      summary: Get API audit summary
      tags:
      - Audit Logs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/banners/:
    get:
      operationId: banners_list
      parameters:
      - in: query
        name: position
        schema:
          type: string
          enum:
          - CATEGORY
          - HERO
          - PROMOTIONAL
          - SIDEBAR
        description: |-
          * `HERO` - Hero Banner
          * `PROMOTIONAL` - Promotional Banner
          * `CATEGORY` - Category Banner
          * `SIDEBAR` - Sidebar Banner
      tags:
      - banners
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicBanner'
          description: ''
  /api/banners/management/banners/:
    get:
      operationId: banners_management_banners_list
      parameters:
      - in: query
        name: active_from
        schema:
          type: string
          format: date-time
      - in: query
        name: active_until
        schema:
          type: string
          format: date-time
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: position
        schema:
          type: string
          enum:
          - CATEGORY
          - HERO
          - PROMOTIONAL
          - SIDEBAR
        description: |-
          * `HERO` - Hero Banner
          * `PROMOTIONAL` - Promotional Banner
          * `CATEGORY` - Category Banner
          * `SIDEBAR` - Sidebar Banner
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: title
        schema:
          type: string
      tags:
      - banners
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BannerManagement'
          description: ''
    post:
      operationId: banners_management_banners_create
      tags:
      - banners
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BannerManagementRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BannerManagementRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/BannerManagementRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerManagement'
          description: ''
  /api/banners/management/banners/{id}/:
    get:
      operationId: banners_management_banners_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this banner.
        required: true
      tags:
      - banners
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerManagement'
          description: ''
    put:
      operationId: banners_management_banners_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this banner.
        required: true
