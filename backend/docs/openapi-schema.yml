      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BannerManagementRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BannerManagementRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/BannerManagementRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerManagement'
          description: ''
    patch:
      operationId: banners_management_banners_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this banner.
        required: true
